<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" fill="none">
  <defs>
    <linearGradient id="brainContourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5B64" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#88D8C0" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#C75D3E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1A5B64" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="innerGyriGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88D8C0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A5B64" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Silueta Exterior Cerebro y Mente (Continuous Line Art) -->
    <!-- Hemisferio Izquierdo y Derecho Integrados -->
    <path d="M 500,200 
             C 450,150 370,140 310,180 
             C 240,230 220,310 240,390 
             C 210,430 200,490 230,550 
             C 260,610 320,650 390,650 
             C 420,650 450,630 470,600 
             C 490,630 500,680 500,720
             C 500,680 510,630 530,600
             C 550,630 580,650 610,650
             C 680,650 740,610 770,550
             C 800,490 790,430 760,390
             C 780,310 760,230 690,180
             C 630,140 550,150 500,200 Z" 
          stroke="url(#brainContourGrad)" stroke-width="2.5" fill="none"/>

    <!-- Cisura Interhemisférica Central (Línea Media del Cerebro) -->
    <path d="M 500,200 
             C 490,260 510,320 495,380 
             C 480,440 520,500 500,560 
             C 490,600 500,660 500,720" 
          stroke="url(#brainContourGrad)" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

    <!-- Circunvoluciones Internas Hemisferio Izquierdo (Lóbulo Frontal, Parietal, Temporal, Occipital) -->
    <path d="M 330,220 C 370,250 400,220 440,250 C 470,270 480,320 450,350" 
          stroke="url(#innerGyriGrad)" stroke-width="1.8" fill="none"/>
    <path d="M 280,290 C 330,300 350,360 410,360 C 450,360 460,400 440,430" 
          stroke="url(#innerGyriGrad)" stroke-width="1.8" fill="none"/>
    <path d="M 250,380 C 290,390 320,440 370,430 C 420,420 430,470 410,500" 
          stroke="url(#innerGyriGrad)" stroke-width="1.6" fill="none"/>
    <path d="M 270,470 C 310,480 330,530 380,520 C 430,510 440,560 420,590" 
          stroke="url(#innerGyriGrad)" stroke-width="1.6" stroke-dasharray="8 4" fill="none"/>
    <path d="M 320,560 C 350,580 390,570 420,620" 
          stroke="url(#innerGyriGrad)" stroke-width="1.5" fill="none"/>

    <!-- Circunvoluciones Internas Hemisferio Derecho (Creatividad, Intuición, Afectividad) -->
    <path d="M 670,220 C 630,250 600,220 560,250 C 530,270 520,320 550,350" 
          stroke="url(#innerGyriGrad)" stroke-width="1.8" fill="none"/>
    <path d="M 720,290 C 670,300 650,360 590,360 C 550,360 540,400 560,430" 
          stroke="url(#innerGyriGrad)" stroke-width="1.8" fill="none"/>
    <path d="M 750,380 C 710,390 680,440 630,430 C 580,420 570,470 590,500" 
          stroke="url(#innerGyriGrad)" stroke-width="1.6" fill="none"/>
    <path d="M 730,470 C 690,480 670,530 620,520 C 570,510 560,560 580,590" 
          stroke="url(#innerGyriGrad)" stroke-width="1.6" stroke-dasharray="8 4" fill="none"/>
    <path d="M 680,560 C 650,580 610,570 580,620" 
          stroke="url(#innerGyriGrad)" stroke-width="1.5" fill="none"/>

    <!-- Bucles y Ondas Sinápticas Flotantes alrededor del Cerebro -->
    <path d="M 180,260 C 130,320 120,440 160,520 C 190,580 230,620 280,680" 
          stroke="url(#brainContourGrad)" stroke-width="1.2" stroke-dasharray="4 6" fill="none"/>
    <path d="M 820,260 C 870,320 880,440 840,520 C 810,580 770,620 720,680" 
          stroke="url(#brainContourGrad)" stroke-width="1.2" stroke-dasharray="4 6" fill="none"/>

    <!-- Puntos Sinápticos de Conexión y Lucidez -->
    <circle cx="500" cy="200" r="4" fill="#88D8C0" fill-opacity="0.4"/>
    <circle cx="450" cy="350" r="3.5" fill="#1A5B64" fill-opacity="0.3"/>
    <circle cx="550" cy="350" r="3.5" fill="#C75D3E" fill-opacity="0.3"/>
    <circle cx="410" cy="500" r="4" fill="#88D8C0" fill-opacity="0.35"/>
    <circle cx="590" cy="500" r="4" fill="#88D8C0" fill-opacity="0.35"/>
    <circle cx="500" cy="720" r="5" fill="#1A5B64" fill-opacity="0.3"/>
  </g>
</svg>
